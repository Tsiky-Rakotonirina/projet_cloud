# Project-wide Gradle settings.

# JVM arguments for Gradle daemon
org.gradle.jvmargs=-Xmx1536m

# Enable AndroidX
android.useAndroidX=true

# Use JAVA_HOME environment variable instead of hardcoded path
# Make sure JAVA_HOME is set to your JDK installation path
# org.gradle.java.home=C:/Program Files/Java/jdk-22

# Optional: enable parallel builds (faster for multi-module projects)
# org.gradle.parallel=true
